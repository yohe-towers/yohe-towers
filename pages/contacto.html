<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Indumentaria femenina nacional e importada. Envíos a toda Argentina y cuotas sin interés">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto | AMOR BOUTIQUE</title>
</head>
<body>
    <!--Aqui voy a agregar el logo y nombre de la marca-->
    <header class="encabezado">
        <a href="../index.html" class="logo">
            <img src="../images/logo sin slogan.jpg" alt="logo-marca">
        </a>
        <h1 class="marca">AMOR BOUTIQUE</h1>
    <!--Aqui voy a crear el menu de navegación-->
    <nav class="navbar">
        <ul class="menubar">
            <li><a href="../index.html"> Inicio</a></li>
            <li><a href="coleccion.html">Colección</a></li> 
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="contacto.html" class="activo">Contacto</a></li>
            <li><a href="#resena">Reseñas</a></li>
        </ul>
    </nav>
    </header>

    <main>
        <!-- AQUI VOY A CREAR EL FORMULARIO-->
        <section id="seccion-contacto">
            <h3>Contáctanos</h3>
                <form class="formulario" action="https://formsubmit.co/amorboutique07@gmail.com" method="POST">
                    <div class="contacto">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
                    </div>

                    <div class="contacto">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="contacto">
                        <label for="mensaje">Deja aquí tu consulta o mensaje.</label>
                        <textarea id="mensaje" name="mensaje" placeholder="Escribí aquí tu consulta." required></textarea>
                    </div>
                    
                    <input type="hidden" name="_captcha" value="false">

        <!-- AQUI VOY A CREAR EL BOTON PARA ENVIAR EL FORMULARIO-->
                    <button type="submit" class="btn-enviar">Enviar por mail</button>
                </form>
        </section>
    </main>

    <!--Aqui voy a crear el pie de pagina-->
    <footer class="pie-de-pagina">
        <p>&copy; Amor Boutique | Luce Chic con Nosotros</p>
        <p>Diseñado por Yohelin Torres, para Talento Tech</p>

        <div class="redes-sociales">
            <a href="https://www.instagram.com/amorboutique7" target="_blank" aria-label="instagram"><i class="redes fa-brands fa-instagram fa-3x"></i></a>
        </div>
    </footer>
</body>
</html>
